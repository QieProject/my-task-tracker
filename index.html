<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Task Tracker</h1>

  <button id="openFormBtn">Add New Task</button>

  <div id="reminderBox"></div>

  <table>
    <thead>
      <tr>
        <th>Status</th>
        <th>Submission Date</th>
        <th>Subject</th>
        <th>Title</th>
        <th>Category</th>
        <th>Description</th>
        <th>Date Added</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="taskList"></tbody>
  </table>

  <div id="modal" class="modal">
    <div class="modal-box">
      <h2 id="modalTitle">Add New Task</h2>

      <label>Task name (course name)</label>
      <input type="text" id="taskSubject">

      <label>Task title</label>
      <input type="text" id="taskTitle">

      <label>Task category</label>
      <select id="taskCategory">
        <option value="Assignment">Assignment</option>
        <option value="Meeting">Meeting</option>
        <option value="Presentation">Presentation</option>
        <option value="Quiz">Quiz</option>
        <option value="Test">Test</option>
        <option value="Other">Other</option>
      </select>

      <label>Submission date</label>
      <input type="date" id="taskSubmitDate">

      <label>Task description</label>
      <textarea id="taskDecs" rows="3"></textarea>

      <button id="addBtn">Add New</button>
      <button id="cancelBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
