<!DOCTYPE html>
<html>

<head>
  <title>My Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>My Task Tracker</h1>

  <!-- 
  <button id="notifyBtn">Enable Notification</button>
  <div id="reminderBox"></div> 
  -->

  <form action="">
    <label for="">Task name (course name)</label> <br>
    <input type="text" id="taskSubject" placeholder="Task Name">

    <br><br>

    <label for="">Task title</label> <br>
    <input type="text" id="taskTitle" placeholder="Title">

    <br><br>

    <label for="">Task category</label> <br>
    <select id="taskCategory">
      <option value="Assignment">Assignment</option>
      <option value="Meeting">Meeting</option>
      <option value="Presentation">Presentation</option>
      <option value="Quiz">Quiz</option>
      <option value="Test">Test</option>
      <option value="Other">Other</option>
    </select>

    <br><br>

    <label for="">Submission date</label> <br>
    <input type="date" id="taskSubmitDate">

    <br><br>

    <label for="">Task Description</label> <br>
    <textarea id="taskDecs" placeholder="Description"></textarea>

    <br><br>

    <button id="addBtn">Add New</button>

  </form>

  <br><br>

  <table border="1">
    <thead>
      <tr>
        <th>Status</th>
        <th>Submission Date</th>
        <th>Subject</th>
        <th>Title</th>
        <th>Category</th>
        <th>Description</th>
        <th>Date Added</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="taskList"></tbody>
  </table>

  <script src="script.js"></script>
</body>

</html>
